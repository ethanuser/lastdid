# The app now lives on GitHub Pages (https://ethanuser.github.io/lastdid/).
# The old Netlify address only forwards there, so saved links and home-screen icons keep working.
[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "https://ethanuser.github.io/lastdid/:splat"
  status = 301
  force = true
